[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bigbrain"
version = "0.1.0"
description = "Big Brain Time: a self-linking trading knowledge brain that learns from papers, market data, indicators and strategies."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
cortex = ["anthropic>=1.0"]
dev = ["pytest>=8"]

[project.scripts]
bigbrain = "bigbrain.cli:main"

[tool.setuptools.packages.find]
include = ["bigbrain*"]
